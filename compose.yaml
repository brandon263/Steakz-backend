services:
  db:
    image: postgres:16-alpine
    container_name: steakz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - steakz_postgres_data:/var/lib/postgresql/data

volumes:
  steakz_postgres_data:
